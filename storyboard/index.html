<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NANOHANA AI 絵コンテ</title><style>body{margin:0;background:#f3f4f5;color:#24282d;font:15px/1.8 sans-serif;letter-spacing:0}header,main{max-width:1320px;margin:auto;padding:28px}h1{font-size:26px;margin:0}header p{max-width:80em}video{display:block;width:100%;max-width:960px;aspect-ratio:16/9;background:#111;margin-top:24px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}figure{margin:0;border-bottom:1px solid #c9ced4;padding-bottom:24px}img{display:block;width:100%;height:auto}h2{font-size:19px;margin:14px 0 6px}p{margin:6px 0}.sub{color:#606870}a{color:#24567c}@media(max-width:760px){main{grid-template-columns:1fr}header,main{padding:18px}h1{font-size:22px}}</style><header><h1>NANOHANA AI / 第1話「発動」</h1><p>ましろの普通の朝から、帰り道の異変、白い円の発動と失神、病院での目覚めまでを描く41秒の予告編。あすかの問いかけで、人との関わりが始まるところまでつなぐ。</p><p class="sub">制作上の決定：あすかは細身の肩・胴体と白衣のシルエットを維持。ましろは黒ボブ、紺ブレザー、青いリボンを維持。発動後の膝崩れ・倒れる場面は、川に面した横方向の欄干と遠景のアーチ橋を揃える。台詞は字幕で、キャラクター音声は未収録。人物は静止作画を使用し、文字とカメラを動かす。後付けの魔法エフェクトは使わない。</p><a href="flow.md">流れの文章ファイル</a><video controls preload="metadata" src="../assets/video/nanohana-episode01-v5-matched.mp4"></video></header><main><figure><img src="cuts/01-morning.png" alt="CUT 01 寮の朝" width="960" height="600" loading="lazy"><figcaption><h2>01 / 寮の朝</h2><p>窓辺のましろ。菜の花の見える、いつもの朝から始まる。</p><p class="sub">字幕：三月の終わり。</p></figcaption></figure><figure><img src="cuts/02-notebook.png" alt="CUT 02 授業中のノート" width="960" height="600" loading="lazy"><figcaption><h2>02 / 授業中のノート</h2><p>ノートに菜の花を描く手元。守りたい日常を短いカットで見せる。</p><p class="sub">字幕：いつもの、一日。</p></figcaption></figure><figure><img src="cuts/03-notice.png" alt="CUT 03 封鎖に気づく" width="960" height="600" loading="lazy"><figcaption><h2>03 / 封鎖に気づく</h2><p>帰り道でましろが立ち止まり、封鎖テープの向こうを見る。</p><p class="sub">字幕：帰り道が、</p></figcaption></figure><figure><img src="cuts/04-bridge.png" alt="CUT 04 橋の異変" width="960" height="600" loading="lazy"><figcaption><h2>04 / 橋の異変</h2><p>橋の向こうに動かない人々。ましろの視線の先を見せる。</p><p class="sub">字幕：止まっていた。</p></figcaption></figure><figure><img src="cuts/05-step.png" alt="CUT 05 あすかが進む" width="960" height="600" loading="lazy"><figcaption><h2>05 / あすかが進む</h2><p>白衣の裾と足元。あすかが封鎖の先へ進む。</p><p class="sub">字幕：「下がって」</p></figcaption></figure><figure><img src="cuts/06-asuka-power.png" alt="CUT 06 千里眼" width="960" height="600" loading="lazy"><figcaption><h2>06 / 千里眼</h2><p>あすかが目を閉じて力を使う。元の絵にある光だけを見せる。</p><p class="sub">字幕：開眼し、／現実を見渡せ</p></figcaption></figure><figure><img src="cuts/07-awakening.png" alt="CUT 07 ましろの発動" width="960" height="600" loading="lazy"><figcaption><h2>07 / ましろの発動</h2><p>ましろの手の甲に白い円が現れる。本人は戸惑い、消そうとする。</p><p class="sub">字幕：え、／なにこれ。／消えて。</p></figcaption></figure><figure><img src="cuts/08-overhead.png" alt="CUT 08 系譜のない力" width="960" height="600" loading="lazy"><figcaption><h2>08 / 系譜のない力</h2><p>橋上のましろを俯瞰で見せる。後付けの円や粒子は重ねない。</p><p class="sub">字幕：誰の系譜でもない。</p></figcaption></figure><figure><img src="cuts/09-asuka-reaction.png" alt="CUT 09 あすかの反応" width="960" height="600" loading="lazy"><figcaption><h2>09 / あすかの反応</h2><p>細身に修正したあすかが目を開く。見たことのない発動に驚く。</p><p class="sub">字幕：「……なに、あれ」</p></figcaption></figure><figure><img src="cuts/10-buckle.png" alt="CUT 10 光が消え、力が抜ける" width="960" height="600" loading="lazy"><figcaption><h2>10 / 光が消え、力が抜ける</h2><p>ましろの手の光は消えている。安心した直後、膝から力が抜ける。</p><p class="sub">字幕：「あ、消えた」</p></figcaption></figure><figure><img src="cuts/11-collapse.png" alt="CUT 11 倒れる" width="960" height="600" loading="lazy"><figcaption><h2>11 / 倒れる</h2><p>同じ欄干・川・遠景の橋を背に、ましろが横たわる。字幕を切って倒れた事実を見せる。</p><p class="sub">字幕：なし</p></figcaption></figure><figure><img src="cuts/12-blackout.png" alt="CUT 12 暗転" width="960" height="600" loading="lazy"><figcaption><h2>12 / 暗転</h2><p>意識が途切れ、時間と場所が変わる。</p><p class="sub">字幕：なし</p></figcaption></figure><figure><img src="cuts/13-hospital.png" alt="CUT 13 病院で目覚める" width="960" height="600" loading="lazy"><figcaption><h2>13 / 病院で目覚める</h2><p>ましろが病室で目を覚ます。そばにいるあすかが心配そうに声をかける。</p><p class="sub">字幕：目が覚めると、病院にいた。／「大丈夫？」</p></figcaption></figure><figure><img src="cuts/14-title.png" alt="CUT 14 タイトル" width="960" height="600" loading="lazy"><figcaption><h2>14 / タイトル</h2><p>NANOHANA AIの文字が順に現れ、第1話の題名で締める。</p><p class="sub">字幕：誰のものでもない、白い花。／NANOHANA AI／第1話「発動」</p></figcaption></figure></main></html>
